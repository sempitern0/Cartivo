name: Setup
description: pnpm, Node (from .node-version) and the locked dependencies, cached.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.25.0
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
