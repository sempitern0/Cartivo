name: Foundation CI
# One run per change: pull requests (and main). Docs-only changes skip it and
# a newer push to the same branch cancels the run still in progress.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:core
      # Cheap guard (no Rust): a PR that changes a core's sources, Cargo.toml
      # or toolchain must also bring the rebuilt dist/ and manifest.json.
      - name: Core sources come with rebuilt artefacts
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          status=0
          for dir in cores/*/; do
            changed=$(git diff --name-only FETCH_HEAD HEAD -- "$dir")
            sources=$(printf '%s\n' "$changed" | grep -E '/(src/|Cargo\.toml$|rust-toolchain\.toml$|build\.rs$)' || true)
            if [ -n "$sources" ] && ! printf '%s\n' "$changed" | grep -q '/manifest\.json$'; then
              echo "::error::$dir changed without rebuilt artefacts (run its core workflow once):"
              echo "$sources"
              status=1
            fi
          done
          exit $status
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:preview
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
  # Same E2E suite in Firefox, in parallel with the Chromium job (H1-QA).
  e2e-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps firefox
      - run: pnpm test:e2e:firefox
      - if: ${{ !cancelled() }}
        run: pnpm test:e2e:preview:firefox
