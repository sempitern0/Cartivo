name: Foundation CI
# One run per change: pull requests (and main). Docs-only changes skip it and
# a newer push to the same branch cancels the run still in progress.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Fast checks: core integrity, formatting, types and unit tests.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm verify:core
      # Cheap guard (no Rust): a PR that changes a core's sources, Cargo.toml
      # or toolchain must also bring the rebuilt dist/ and manifest.json.
      - name: Core sources come with rebuilt artefacts
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          status=0
          for dir in cores/*/; do
            changed=$(git diff --name-only FETCH_HEAD HEAD -- "$dir")
            sources=$(printf '%s\n' "$changed" | grep -E '/(src/|Cargo\.toml$|rust-toolchain\.toml$|build\.rs$)' || true)
            if [ -n "$sources" ] && ! printf '%s\n' "$changed" | grep -q '/manifest\.json$'; then
              echo "::error::$dir changed without rebuilt artefacts (run its core workflow once):"
              echo "$sources"
              status=1
            fi
          done
          exit $status
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
  # The E2E suite in each browser against each server, all in parallel: the
  # slowest leg sets the wall time instead of the sum of the four.
  e2e:
    name: e2e (${{ matrix.browser }}, ${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        server: [dev, preview]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Only the production build has a service worker (PWA tests).
      - if: matrix.server == 'preview'
        run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # Firefox needs a sound server to open an AudioContext on Linux; the
      # runner has no sound card, so a null sink stands in for speakers.
      - name: Virtual audio output
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y -q pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=cartivo
      - run: >-
          ${{ matrix.browser == 'webkit' && 'xvfb-run --auto-servernum' || '' }}
          pnpm exec playwright test --project=${{ matrix.browser }}
          ${{ matrix.browser == 'webkit' && '--headed' || '' }}
          ${{ matrix.server == 'preview' && '--config playwright.preview.config.ts' || '' }}
          ${{ matrix.browser == 'webkit' && '--retries=0 tests/e2e/zz-diag.spec.ts' || '' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.browser }}-${{ matrix.server }}
          path: |
            screenshots/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
