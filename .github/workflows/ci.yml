name: Foundation CI
# One run per change: pull requests (and main). Docs-only changes skip it and
# a newer push to the same branch cancels the run still in progress.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Fast checks: core integrity, formatting, types and unit tests.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm verify:core
      # Cheap guard (no Rust): a PR that changes a core's sources, Cargo.toml
      # or toolchain must also bring the rebuilt dist/ and manifest.json.
      - name: Core sources come with rebuilt artefacts
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          status=0
          for dir in cores/*/; do
            changed=$(git diff --name-only FETCH_HEAD HEAD -- "$dir")
            sources=$(printf '%s\n' "$changed" | grep -E '/(src/|Cargo\.toml$|rust-toolchain\.toml$|build\.rs$)' || true)
            if [ -n "$sources" ] && ! printf '%s\n' "$changed" | grep -q '/manifest\.json$'; then
              echo "::error::$dir changed without rebuilt artefacts (run its core workflow once):"
              echo "$sources"
              status=1
            fi
          done
          exit $status
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
  # Each browser reuses one installation for dev and preview. Chromium also
  # checks the sub-path build; no browser or server coverage is removed.
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Cache by Playwright version, architecture and the pinned runner OS.
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-cache
          key: playwright-v2-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24
      - name: Browser and system libraries
        id: browser
        timeout-minutes: 8
        env:
          BROWSER: ${{ matrix.browser }}
          CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHED" != "true" ]; then pnpm exec playwright install "$BROWSER"; fi
          mkdir -p "$HOME/apt-cache/partial"
          # Restore .debs into apt's default cache, then let Playwright select
          # dependencies. Human-readable --dry-run output is not an API.
          sudo cp -n "$HOME"/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80cartivo-ci >/dev/null
          # The Azure mirror stalled in measured runs; retain Ubuntu's signed
          # repositories and suites, changing only that mirror hostname.
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            [ -f "$sources" ] || continue
            sudo sed -i 's|://azure.archive.ubuntu.com/ubuntu|://archive.ubuntu.com/ubuntu|g' "$sources"
          done
          pnpm exec playwright install-deps "$BROWSER"
          sudo cp -n /var/cache/apt/archives/*.deb "$HOME/apt-cache/" 2>/dev/null || true
          sudo chown -R "$USER" "$HOME/apt-cache"
      - name: Save browser installation
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-cache
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      # Firefox needs a sound server to open an AudioContext on Linux; the
      # runner has no sound card, so a null sink stands in for speakers.
      - name: Virtual audio output
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y -q pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=cartivo
      # Keep running the other server after a test failure; preserve outputs
      # separately so a later Playwright invocation cannot erase the evidence.
      - name: E2E dev
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: >-
          ${{ matrix.browser == 'webkit' && 'xvfb-run --auto-servernum' || '' }}
          pnpm exec playwright test --project=${{ matrix.browser }}
          ${{ matrix.browser == 'webkit' && '--headed' || '' }}
          --output=test-results/dev
      - name: Build preview
        id: build
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm build
      - name: E2E preview
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          ${{ matrix.browser == 'webkit' && 'xvfb-run --auto-servernum' || '' }}
          pnpm exec playwright test --project=${{ matrix.browser }}
          ${{ matrix.browser == 'webkit' && '--headed' || '' }}
          --config playwright.preview.config.ts --output=test-results/preview
      - name: Build subpath
        id: subpath
        if: ${{ !cancelled() && matrix.browser == 'chromium' && steps.browser.outcome == 'success' }}
        run: pnpm build --base /cartivo/
      - name: E2E subpath
        if: ${{ !cancelled() && matrix.browser == 'chromium' && steps.subpath.outcome == 'success' }}
        run: pnpm exec playwright test --project=chromium --config playwright.subpath.config.ts --output=test-results/subpath
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            screenshots/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
