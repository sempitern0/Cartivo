name: Foundation CI
# One run per change: pull requests (and main). Docs-only changes skip it and
# a newer push to the same branch cancels the run still in progress.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Fast checks: core integrity, formatting, types and unit tests.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm verify:core
      # Cheap guard (no Rust): a PR that changes a core's sources, Cargo.toml
      # or toolchain must also bring the rebuilt dist/ and manifest.json.
      - name: Core sources come with rebuilt artefacts
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          status=0
          for dir in cores/*/; do
            changed=$(git diff --name-only FETCH_HEAD HEAD -- "$dir")
            sources=$(printf '%s\n' "$changed" | grep -E '/(src/|Cargo\.toml$|rust-toolchain\.toml$|build\.rs$)' || true)
            if [ -n "$sources" ] && ! printf '%s\n' "$changed" | grep -q '/manifest\.json$'; then
              echo "::error::$dir changed without rebuilt artefacts (run its core workflow once):"
              echo "$sources"
              status=1
            fi
          done
          exit $status
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
  # The E2E suite in each browser against each server, all in parallel: the
  # slowest leg sets the wall time instead of the sum of the four.
  e2e:
    name: e2e (${{ matrix.browser }}, ${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        server: [dev, preview]
        # The production build deployed under a sub-path (/cartivo/).
        include:
          - browser: chromium
            server: subpath
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Only the production build has a service worker (PWA tests).
      - if: matrix.server != 'dev'
        run: pnpm build ${{ matrix.server == 'subpath' && '--base /cartivo/' || '' }}
      # Browsers are cached by Playwright's version. System libraries come
      # from apt without Playwright's optional fonts: the runner's mirror
      # stalls for minutes on them (fonts-freefont-ttf, fonts-ipafont-*), and
      # no test reads rendered text. The step fails fast to be re-run.
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Browser and system libraries
        timeout-minutes: 5
        env:
          BROWSER: ${{ matrix.browser }}
          CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHED" != "true" ]; then pnpm exec playwright install "$BROWSER"; fi
          # The dry run lists what is missing (and exits 1 if anything is).
          missing=$( (pnpm exec playwright install-deps --dry-run "$BROWSER" 2>&1 || true) \
            | sed -n 's/^  //p' | grep -vE '^(x?fonts-|ttf-)' | tr '\n' ' ')
          echo "Missing libraries (fonts skipped): ${missing:-none}"
          if [ -n "${missing// }" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends $missing
          fi
      # Firefox needs a sound server to open an AudioContext on Linux; the
      # runner has no sound card, so a null sink stands in for speakers.
      - name: Virtual audio output
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y -q pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=cartivo
      # Headless WebKit on Linux fires requestAnimationFrame about twice a
      # second (no display), so the game loop falls behind and pauses. With
      # a virtual display it runs at 60 Hz like Safari.
      - run: >-
          ${{ matrix.browser == 'webkit' && 'xvfb-run --auto-servernum' || '' }}
          pnpm exec playwright test --project=${{ matrix.browser }}
          ${{ matrix.browser == 'webkit' && '--headed' || '' }}
          ${{ matrix.server != 'dev' && format('--config playwright.{0}.config.ts', matrix.server) || '' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.browser }}-${{ matrix.server }}
          path: |
            screenshots/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
