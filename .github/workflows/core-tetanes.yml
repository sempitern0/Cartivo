name: Core TetaNES
# EXPENSIVE: builds the TetaNES WebAssembly core using Rust.
# Normal PR/push CI runs only the cheap committed-artifact integrity check.
# Before this workflow exists on main, a deliberate push changing
# cores/tetanes/.build-request can request a one-off build on the PR branch.
# After merge, workflow_dispatch is available for explicit build/verify runs.
# Never rebuild automatically just because application code or a PR changed.
on:
  push:
    # Work branches only: merging a PR that carried a build request must not
    # rebuild on main (main uses workflow_dispatch for deliberate builds).
    branches-ignore: [main]
    paths:
      - "cores/tetanes/.build-request"
  workflow_dispatch:
    inputs:
      mode:
        description: "EXPLICIT ONLY: build and commit artefacts, or rebuild once to verify reproducibility"
        default: build
        type: choice
        options: [build, verify]
permissions:
  contents: read
concurrency:
  group: core-tetanes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  core:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'build' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: cores/tetanes
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            cores/tetanes/target
          key: tetanes-${{ hashFiles('cores/tetanes/Cargo.toml', 'cores/tetanes/Cargo.lock', 'cores/tetanes/rust-toolchain.toml') }}
          restore-keys: tetanes-
      - name: Resolve dependencies
        working-directory: cores/tetanes
        run: |
          if [ ! -f Cargo.lock ]; then
            test "$MODE" = build || { echo "Cargo.lock missing"; exit 1; }
            cargo generate-lockfile
          fi
          cargo fetch --locked --target wasm32-unknown-unknown
      - name: Licence and source gate (CORE-LEGAL-01)
        run: |
          command -v cargo-deny >/dev/null || cargo install cargo-deny --version "~0.18" --locked
          cargo deny --manifest-path cores/tetanes/Cargo.toml check licenses sources
      - name: Build
        run: node tools/build-tetanes.mjs ${{ env.MODE == 'verify' && '--verify' || '' }}
      - name: Commit artefacts
        if: env.MODE == 'build'
        run: |
          git config user.name "cartivo-core-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cores/tetanes/Cargo.lock cores/tetanes/dist cores/tetanes/manifest.json cores/tetanes/sbom.json
          if git diff --cached --quiet; then echo "Artefacts unchanged"; exit 0; fi
          HASH=$(sha256sum cores/tetanes/dist/tetanes_bg.wasm | cut -c1-12)
          git commit -m "chore(core): build TetaNES WASM ${HASH}"
          git push
          # GITHUB_TOKEN pushes do not start another workflow. Inspect the
          # committed hashes with Foundation CI on the final SHA; do NOT
          # automatically start another expensive Rust verification build.
