# CORE-LEGAL-01: only permissive licences compatible with redistribution
# next to PolyForm Noncommercial code. Anything else fails the build.
[graph]
targets = ["wasm32-unknown-unknown"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
