# CORE-LEGAL-01: only permissive licences compatible with redistribution
# next to PolyForm Noncommercial code. Anything else fails the build.
[graph]
targets = ["wasm32-unknown-unknown"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]
confidence-threshold = 0.9

# Owner decision 2026-11-01 (docs/research/TETANES_CORE_GATE.md): MPL-2.0 is
# accepted only for this unmodified crate (dirs -> dirs-sys -> option-ext),
# with its source linked from LICENSES.md. Any other MPL crate still fails.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
