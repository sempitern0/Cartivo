# CORE-LEGAL-01 licence and source gate for the TetaNES build.
[graph]
targets = ["wasm32-unknown-unknown"]

[licenses]
# Private-use policy (ADR-005, 2026-11-01): any identified free/open licence
# is accepted while Cartivo is not distributed to third parties. Unknown or
# missing licences still fail. Review before any public release.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "GPL-2.0-only",
  "GPL-2.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
